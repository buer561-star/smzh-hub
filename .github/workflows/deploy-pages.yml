name: Deploy smzHub mirror to GitHub Pages

on:
  push:
    branches: ["claude/inspiring-dirac-2ioa4s"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Es darf immer nur ein Pages-Deployment gleichzeitig laufen
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages (aktiviert Pages bei Bedarf automatisch)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
